    window.storage = {
      get: function(key, shared) {
        try {
          var val = localStorage.getItem((shared ? 's_' : 'p_') + key);
          return Promise.resolve(val !== null ? { key: key, value: val, shared: !!shared } : null);
        } catch(e) { return Promise.reject(e); }
      },
      set: function(key, value, shared) {
        try {
          localStorage.setItem((shared ? 's_' : 'p_') + key, String(value));
          return Promise.resolve({ key: key, value: value, shared: !!shared });
        } catch(e) { return Promise.reject(e); }
      },
      delete: function(key, shared) {
        try {
          localStorage.removeItem((shared ? 's_' : 'p_') + key);
          return Promise.resolve({ key: key, deleted: true, shared: !!shared });
        } catch(e) { return Promise.reject(e); }
      },
      list: function(prefix, shared) {
        try {
          var pfx = (shared ? 's_' : 'p_') + (prefix || '');
          var keys = Object.keys(localStorage).filter(function(k){ return k.startsWith(pfx); }).map(function(k){ return k.slice(2); });
          return Promise.resolve({ keys: keys, prefix: prefix, shared: !!shared });
        } catch(e) { return Promise.reject(e); }
      }
    };

const CONFIG = {
  PIN: "1004",
  START_DATE: new Date("2026-05-31"),
  // 1주차 시작일 (2026.05.31 일요일)
  MAX_VIEWS: 3 // 주간 최대 열람 횟수
};

// ── 현재 주차 계산 (START_DATE 기준, 일요일 오픈) ──
function getCurrentWeek() {
  const now = new Date();
  const diff = Math.floor((now - CONFIG.START_DATE) / (7 * 24 * 60 * 60 * 1000));
  return Math.min(Math.max(diff + 1, 1), 32);
}

// ── 이번 주의 주 키 (일요일 기준 뷰 카운트용) ──────
function getWeekKey() {
  const now = new Date();
  const day = now.getDay(); // 0=일, 1=월 ... 6=토
  const sunday = new Date(now);
  sunday.setDate(now.getDate() - day);
  const y = sunday.getFullYear();
  const m = String(sunday.getMonth() + 1).padStart(2, "0");
  const d = String(sunday.getDate()).padStart(2, "0");
  return "begins_views_".concat(y, "_").concat(m).concat(d);
}
